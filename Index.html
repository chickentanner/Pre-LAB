    const dims = ["EI", "SN", "TF", "JP"];

    // ==========================================
    // 2. 글로벌 스타일 컴포넌트

    const GlobalStyles = () => (

        @keyframes fadeUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeDown { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-30px); } }

        .fadeout { animation: fadeDown 0.3s ease forwards; }

          background: linear-gradient(135deg,#22c55e,#16a34a); color: #fff; border: none;
          border-radius: 50px; padding: 18px 52px; font-size: 18px; font-weight: 800;
          cursor: pointer; box-shadow: 0 8px 32px rgba(34,197,94,0.4); transition: all 0.2s;
        }
        .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 12px 40px rgba(34,197,94,0.5); }
        .btn-secondary {
          width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
          color: rgba(255,255,255,0.7); border-radius: 14px; padding: 14px; font-size: 15px;
          font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-secondary:hover{ background:rgba(255,255,255,0.1); color:#fff; }
        .btn-ans {
          border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 18px 22px;

          transition: all 0.2s; display: flex; align-items: flex-start; gap: 14px; width: 100%;
          background: rgba(255,255,255,0.04);
        }
        .btn-ans:hover { background: rgba(34,197,94,0.08); border-color: rgba(34,197,94,0.3); transform: translateX(4px); }
        .btn-ans.chosen { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.6); transform: scale(0.98); opacity: 0.7; }

    // ==========================================
    // 3. 자식 컴포넌트: Intro

    function Intro({ onStart }) {
      return (
        <div className="fadein" style={{ maxWidth: 520, width: "100%", textAlign: "center" }}>
          <div style={{ width: 90, height: 90, background: "linear-gradient(135deg,#22c55e,#16a34a)", borderRadius: 24, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 44, margin: "0 auto 28px", boxShadow: "0 8px 32px rgba(34,197,94,0.4)" }}>🌿</div>
          <div style={{ display: "inline-block", background: "rgba(34,197,94,0.12)", border: "1px solid rgba(34,197,94,0.3)", color: "#4ade80", padding: "5px 18px", borderRadius: 20, fontSize: 12, fontWeight: 700, letterSpacing: 2, marginBottom: 16 }}>직원 유형 세일즈 전략</div>

          <p style={{ color: "rgba(255,255,255,0.5)", fontSize: 15, lineHeight: 1.8, marginBottom: 36 }}>내 성격 유형에 맞는 <strong style={{ color: "#4ade80" }}>보험 세일즈 전략</strong>을 찾아보세요<br/>강점은 극대화하고, 약점은 보완하는 나만의 방법이 있습니다</p>
          <button className="btn-primary" onClick={onStart}>내 유형 알아보기 →</button>
          <p style={{ color: "rgba(255,255,255,0.25)", fontSize: 12, marginTop: 20 }}>총 8문항 · 약 2분 · 16가지 유형 분석</p>
        </div>
      );
    }

    // ==========================================
    // 4. 자식 컴포넌트: Quiz
    // ==========================================
    function Quiz({ initialAnswers, onFinish }) {
      const [current, setCurrent] = useState(0);
      const [answers, setAnswers] = useState(initialAnswers);
      const [chosen, setChosen] = useState(null);
      const [animating, setAnimating] = useState(false);

      const handleAnswer = (value, opt) => {
        if (animating) return;
        setChosen(opt);
        setAnimating(true);
        const q = questions[current];
        const newAnswers = { ...answers, [q.dim]: value };
        setTimeout(() => {
          setAnswers(newAnswers);
          setChosen(null);
          setAnimating(false);
          if (current + 1 < questions.length) {
            setCurrent(current + 1);
          } else {
            onFinish(newAnswers);
          }
        }, ANIMATION_DURATION_MS);
      };

      return (
        <div style={{ maxWidth: 560, width: "100%" }}>
          <div style={{ marginBottom: 28 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
              <span style={{ color: "rgba(255,255,255,0.4)", fontSize: 13 }}>{current + 1} / {questions.length}</span>
              <div style={{ display: "flex", gap: 6 }}>
                {dims.map((d, i) => {
                  const answered = Object.values(answers)[i] !== "";
                  const active = questions[current]?.dim === d;
                  return (
                    <div key={d} style={{ width: 28, height: 28, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, background: answered ? "linear-gradient(135deg,#22c55e,#16a34a)" : active ? "rgba(34,197,94,0.15)" : "rgba(255,255,255,0.05)", color: answered ? "#fff" : active ? "#4ade80" : "rgba(255,255,255,0.2)", border: active ? "1px solid #4ade80" : "1px solid transparent", transition: "all 0.3s" }}>{dimLabels[i]}</div>
                  );
                })}
              </div>
            </div>
            <div style={{ background: "rgba(255,255,255,0.06)", borderRadius: 10, height: 4 }}>
              <div style={{ height: "100%", width: `${(current / questions.length) * 100}%`, background: "linear-gradient(90deg,#22c55e,#86efac)", borderRadius: 10, transition: "width 0.4s ease" }} />
            </div>
          </div>
          <div className={animating ? "fadeout" : "fadein"} style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.07)", borderRadius: 24, padding: "36px 32px" }}>
            <div style={{ textAlign: "center", marginBottom: 32 }}>
              <div style={{ width: 64, height: 64, background: "rgba(34,197,94,0.1)", border: "1px solid rgba(34,197,94,0.2)", borderRadius: 16, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 30, margin: "0 auto 18px" }}>{questions[current]?.emoji}</div>
              <p style={{ color: "rgba(255,255,255,0.4)", fontSize: 12, fontWeight: 700, letterSpacing: 2, marginBottom: 10 }}>Q{current + 1}</p>
              <h2 style={{ fontSize: 19, fontWeight: 700, color: "#fff", lineHeight: 1.6 }}>{questions[current]?.text}</h2>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {["a", "b"].map((opt) => (
                <button key={opt} className={`btn-ans ${chosen === opt ? "chosen" : ""}`} onClick={() => handleAnswer(questions[current][opt].value, opt)}>
                  <span style={{ minWidth: 28, height: 28, background: opt === "a" ? "linear-gradient(135deg,#22c55e,#16a34a)" : "rgba(255,255,255,0.1)", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 900, color: "#fff" }}>{opt.toUpperCase()}</span>
                  <span style={{ flex: 1 }}>{questions[current]?.[opt]?.label}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. 자식 컴포넌트: Result
    // ==========================================
    function Result({ data, onReset }) {
      const handleShare = async () => {
        if (navigator.share) {
          try {
            await navigator.share({ title: '나의 세일즈 MBTI는?', text: `나의 세일즈 무기는 [${data.title}]!`, url: window.location.href });
          } catch (err) { console.log(err); }
        } else {
          navigator.clipboard.writeText(window.location.href);
          alert("링크가 복사되었습니다!");
        }
      };

      return (
        <div className="fadein" style={{ maxWidth: 640, width: "100%" }}>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 28 }}>
              <div style={{ background: "rgba(34,197,94,0.08)", border: "1px solid rgba(34,197,94,0.2)", borderRadius: 14, padding: "14px 16px" }}>
                <p style={{ color: "#4ade80", fontSize: 11, fontWeight: 700, marginBottom: 6 }}>💪 핵심 강점</p>
                <p style={{ color: "rgba(255,255,255,0.75)", fontSize: 13, lineHeight: 1.6 }}>{data.strength}</p>
              </div>
              <div style={{ background: "rgba(251,191,36,0.08)", border: "1px solid rgba(251,191,36,0.2)", borderRadius: 14, padding: "14px 16px" }}>
                <p style={{ color: "#fbbf24", fontSize: 11, fontWeight: 700, marginBottom: 6 }}>⚡ 보완 포인트</p>
                <p style={{ color: "rgba(255,255,255,0.75)", fontSize: 13, lineHeight: 1.6 }}>{data.weakpoint}</p>
              </div>
            </div>
            <div style={{ marginBottom: 28 }}>
              <h3 style={{ color: "rgba(255,255,255,0.35)", fontSize: 11, fontWeight: 700, letterSpacing: 3, marginBottom: 14 }}>나에게 맞는 세일즈 전략</h3>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {data.styles.map((s, i) => (
                  <div key={i} className="slide-r" style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.07)", borderRadius: 14, padding: "16px 18px", display: "flex", gap: 14, alignItems: "flex-start" }}>
                    <span style={{ minWidth: 36, height: 36, background: `rgba(${parseInt(data.accent.slice(1,3),16)},${parseInt(data.accent.slice(3,5),16)},${parseInt(data.accent.slice(5,7),16)},0.15)`, border: `1px solid ${data.accent}40`, borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>{s.icon}</span>
                    <div>
                      <p style={{ color: "#fff", fontWeight: 700, fontSize: 14, marginBottom: 4 }}>{s.label}</p>
                      <p style={{ color: "rgba(255,255,255,0.55)", fontSize: 13, lineHeight: 1.7 }}>{s.tip}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div style={{ background: `rgba(${parseInt(data.accent.slice(1,3),16)},${parseInt(data.accent.slice(3,5),16)},${parseInt(data.accent.slice(5,7),16)},0.08)`, borderLeft: `3px solid ${data.accent}`, borderRadius: 12, padding: "16px 18px", marginBottom: 16 }}>
              <p style={{ color: data.accent, fontWeight: 700, fontSize: 12, marginBottom: 6 }}>🌱 성장 포인트</p>
              <p style={{ color: "rgba(255,255,255,0.65)", fontSize: 13, lineHeight: 1.7 }}>{data.growth}</p>
            </div>
            <div style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.07)", borderRadius: 12, padding: "16px 18px", marginBottom: 24 }}>
              <p style={{ color: "rgba(255,255,255,0.35)", fontWeight: 700, fontSize: 11, letterSpacing: 2, marginBottom: 8 }}>💬 나에게 맞는 세일즈 멘트</p>
              <p style={{ color: "rgba(255,255,255,0.8)", fontSize: 14, lineHeight: 1.7, fontStyle: "italic" }}>{data.script}</p>
            </div>
            <div style={{ display: "flex", gap: 10, marginTop: 32 }}>
              <button className="btn-secondary" style={{ flex: 1, background: "rgba(34,197,94,0.1)", color: "#4ade80", borderColor: "rgba(34,197,94,0.3)" }} onClick={handleShare}>📤 동료에게 공유하기</button>
              <button className="btn-secondary" style={{ flex: 1 }} onClick={onReset}>🔄 다시 테스트하기</button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. 메인 앱 컴포넌트 & 렌더링
    // ==========================================
    function App() {
      const [screen, setScreen] = useState("intro"); 
      const [answers, setAnswers] = useState({ EI: "", SN: "", TF: "", JP: "" });
      const [result, setResult] = useState(null);

      const handleStart = () => setScreen("quiz");
      const handleFinish = (finalAnswers) => {
        const mbti = (finalAnswers.EI || "I") + (finalAnswers.SN || "S") + (finalAnswers.TF || "T") + (finalAnswers.JP || "J");
        setResult(mbtiData[mbti] || mbtiData["ISTJ"]);
        setScreen("result");
      };
      const handleReset = () => {
        setScreen("intro");
        setAnswers({ EI: "", SN: "", TF: "", JP: "" });
        setResult(null);
      };

      return (
        <div className="app-wrapper">
          <GlobalStyles />
          {screen === "intro" && <Intro onStart={handleStart} />}
          {screen === "quiz" && <Quiz initialAnswers={answers} onFinish={handleFinish} />}
          {screen === "result" && <Result data={result} onReset={handleReset} />}
        </div>
      );
    }

    // DOM 렌더링
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
