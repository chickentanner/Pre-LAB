<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>세일즈 플레이어 MBTI</title>
  <meta name="description" content="보험 세일즈 스타일 MBTI 테스트" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #0d1117;
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #0d1117 0%, #161b22 40%, #0d1117 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }
    button { font: inherit; }
    .app { width: 100%; max-width: 640px; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeDown { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-30px); } }
    @keyframes spinIn { from{opacity:0;transform:scale(0.5) rotate(-10deg);} to{opacity:1;transform:scale(1) rotate(0);} }
    @keyframes slideRight { from{opacity:0;transform:translateX(-20px);} to{opacity:1;transform:translateX(0);} }
    .fadein { animation: fadeUp 0.4s ease forwards; }
    .fadeout { animation: fadeDown 0.3s ease forwards; }
    .spinIn { animation: spinIn 0.6s cubic-bezier(.175,.885,.32,1.275) forwards; }
    .slide-r { animation: slideRight 0.4s ease forwards; opacity:0; }
    .slide-r:nth-child(1){animation-delay:0.1s}
    .slide-r:nth-child(2){animation-delay:0.2s}
    .slide-r:nth-child(3){animation-delay:0.3s}
    .slide-r:nth-child(4){animation-delay:0.4s}
    .center { text-align:center; }
    .panel {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 24px;
      padding: 36px 32px;
    }
    .logo {
      width: 90px; height: 90px;
      background: linear-gradient(135deg,#22c55e,#16a34a);
      border-radius: 24px;
      display:flex; align-items:center; justify-content:center;
      font-size:44px; margin:0 auto 28px;
      box-shadow:0 8px 32px rgba(34,197,94,0.4);
    }
    .badge {
      display:inline-block;
      background:rgba(34,197,94,0.12);
      border:1px solid rgba(34,197,94,0.3);
      color:#4ade80;
      padding:5px 18px;
      border-radius:20px;
      font-size:12px;
      font-weight:700;
      letter-spacing:2px;
      margin-bottom:16px;
    }
    .hero-title {
      font-size:32px;
      font-weight:900;
      color:#fff;
      line-height:1.3;
      margin-bottom:12px;
    }
    .gradient-text {
      background:linear-gradient(90deg,#4ade80,#22c55e,#86efac);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .intro-copy {
      color:rgba(255,255,255,0.5);
      font-size:15px;
      line-height:1.8;
      margin-bottom:36px;
    }
    .btn-primary {
      background:linear-gradient(135deg,#22c55e,#16a34a);
      color:#fff;
      border:none;
      border-radius:50px;
      padding:18px 52px;
      font-size:18px;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 8px 32px rgba(34,197,94,0.4);
      transition:all 0.2s;
    }
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(34,197,94,0.5)}
    .btn-primary:active{transform:scale(0.98)}
    .btn-secondary {
      width:100%;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.12);
      color:rgba(255,255,255,0.7);
      border-radius:14px;
      padding:14px;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      transition:all 0.2s;
    }
    .btn-secondary:hover{background:rgba(255,255,255,0.1);color:#fff}
    .btn-ans {
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;
      padding:18px 22px;
      color:#fff;
      font-size:15px;
      font-weight:500;
      cursor:pointer;
      text-align:left;
      transition:all 0.2s;
      display:flex;
      align-items:flex-start;
      gap:14px;
      width:100%;
      background:rgba(255,255,255,0.04);
      line-height:1.6;
    }
    .btn-ans:hover { background: rgba(34,197,94,0.08); border-color: rgba(34,197,94,0.3); transform: translateX(4px); }
    .btn-ans.chosen { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.6); transform: scale(0.98); opacity: 0.7; }
    .topbar { margin-bottom:28px; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .progress { background:rgba(255,255,255,0.06); border-radius:10px; height:4px; overflow:hidden; }
    .progress > div { height:100%; background:linear-gradient(90deg,#22c55e,#86efac); border-radius:10px; transition:width 0.4s ease; }
    .dim-wrap { display:flex; gap:6px; }
    .dim-box {
      width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center;
      font-size:10px; font-weight:800; transition:all 0.3s;
    }
    .q-emoji {
      width:64px; height:64px;
      background:rgba(34,197,94,0.1);
      border:1px solid rgba(34,197,94,0.2);
      border-radius:16px;
      display:flex; align-items:center; justify-content:center;
      font-size:30px; margin:0 auto 18px;
    }
    .question-box { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:24px; padding:36px 32px; }
    .result-head {
      border-radius:24px 24px 0 0;
      padding:44px 40px 36px;
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    .result-body {
      background:rgba(13,17,23,0.95);
      border:1px solid rgba(255,255,255,0.06);
      border-top:none;
      border-radius:0 0 24px 24px;
      padding:32px 36px;
    }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:28px; }
    .card { border-radius:14px; padding:14px 16px; }
    .styles { display:flex; flex-direction:column; gap:10px; margin-bottom:28px; }
    .style-item {
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.07);
      border-radius:14px;
      padding:16px 18px;
      display:flex; gap:14px; align-items:flex-start;
    }
    .style-icon {
      min-width:36px; height:36px; border-radius:10px;
      display:flex; align-items:center; justify-content:center; font-size:18px;
    }
    .muted { color:rgba(255,255,255,0.55); }
    .hint { text-align:center; color:rgba(255,255,255,0.2); font-size:12px; margin-top:16px; }
    .btn-row { display:flex; gap:10px; margin-top:32px; }
    .share-btn { background:rgba(34,197,94,0.1); color:#4ade80; border-color:rgba(34,197,94,0.3); }
    @media (max-width: 640px) {
      .hero-title { font-size:28px; }
      .panel, .question-box, .result-body { padding:24px 20px; }
      .result-head { padding:32px 20px 28px; }
      .grid2 { grid-template-columns:1fr; }
      .btn-row { flex-direction:column; }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>

    const mbtiData = {

    const app = document.getElementById('app');
    const resultCodeMap = { ISTJ:'A', ISFJ:'B', INFJ:'C', INTJ:'D', ISTP:'E', ISFP:'F', INFP:'G', INTP:'H', ESTP:'I', ESFP:'J', ENFP:'K', ENTP:'L', ESTJ:'M', ESFJ:'N', ENFJ:'O', ENTJ:'P' };
    const codeResultMap = Object.fromEntries(Object.entries(resultCodeMap).map(([k,v]) => [v,k]));
    const state = {
      screen: 'intro',
      current: 0,
      answers: { EI: '', SN: '', TF: '', JP: '' },
      chosen: null,
      animating: false,
      resultMbti: null,
    };

    function hexToRgba(hex, alpha) {
      const bigint = parseInt(hex.replace('#', ''), 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function getMbti(answers) {
      return (answers.EI || 'I') + (answers.SN || 'S') + (answers.TF || 'T') + (answers.JP || 'J');
    }

    function getResultData() {
      return mbtiData[state.resultMbti] || null;
    }

    function buildResultUrl(mbti) {
      const url = new URL(window.location.href);
      const code = resultCodeMap[mbti] || 'A';
      url.searchParams.set('r', code);
      url.searchParams.delete('result');
      return url.toString();
    }

    function syncUrlForResult() {
      if (state.resultMbti) {
        history.replaceState({}, '', buildResultUrl(state.resultMbti));
      } else {
        const url = new URL(window.location.href);
        url.searchParams.delete('result');
        url.searchParams.delete('r');
        history.replaceState({}, '', url.toString());
      }
    }

    function reset() {
      state.screen = 'intro';
      state.current = 0;
      state.answers = { EI: '', SN: '', TF: '', JP: '' };
      state.chosen = null;
      state.animating = false;
      state.resultMbti = null;
      syncUrlForResult();
      render();
    }

      state.answers = { EI: '', SN: '', TF: '', JP: '' };
      state.chosen = null;
      state.animating = false;
      render();
    }

    function handleAnswer(value, opt) {
      if (state.animating) return;
      state.chosen = opt;
      state.animating = true;
      render();

      const q = questions[state.current];
      const nextAnswers = { ...state.answers, [q.dim]: value };

      setTimeout(() => {
        state.answers = nextAnswers;
        state.chosen = null;
        state.animating = false;

        if (state.current + 1 < questions.length) {
          state.current += 1;
          render();
        } else {
          const mbti = getMbti(nextAnswers);
          state.resultMbti = mbtiData[mbti] ? mbti : 'ISTJ';
          state.screen = 'result';
          syncUrlForResult();
          render();
        }
      }, ANIMATION_DURATION_MS);
    }

    async function handleShare() {
      const data = getResultData();
      if (!data || !state.resultMbti) return;
      const shareUrl = buildResultUrl(state.resultMbti);
      const shareData = {
        title: '나의 세일즈 MBTI는?',
        text: `나의 세일즈 무기는 [${data.title}]! 나와 꼭 맞는 영업 전략을 확인해보세요.`,
        url: shareUrl,
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          return;
        } catch (e) {}
      }

      try {
        await navigator.clipboard.writeText(shareUrl);
        alert('링크가 클립보드에 복사되었습니다!');
      } catch (e) {
        alert('이 링크를 직접 복사해주세요:\n' + shareUrl);
      }
    }

    function introView() {
      return `
        <div class="fadein center" style="max-width:520px;width:100%;">
          <div class="logo">🌿</div>
          <div class="badge">직원 유형 세일즈 전략</div>
          <h1 class="hero-title">나는 어떤 스타일의<br><span class="gradient-text">세일즈 플레이어</span>일까?</h1>
          <p class="intro-copy">내 성격 유형에 맞는 <strong style="color:#4ade80">보험 세일즈 전략</strong>을 찾아보세요<br>강점은 극대화하고, 약점은 보완하는 나만의 방법이 있습니다</p>
          <button class="btn-primary" id="startBtn">내 유형 알아보기 →</button>
          <p style="color:rgba(255,255,255,0.25);font-size:12px;margin-top:20px;">총 8문항 · 약 2분 · 16가지 유형 분석</p>
        </div>`;
    }

    function quizView() {
      const q = questions[state.current];
      const progress = ((state.current + 1) / questions.length) * 100;
      return `
        <div style="max-width:560px;width:100%;">
          <div class="topbar">
            <div class="row" style="margin-bottom:8px;">
              <span style="color:rgba(255,255,255,0.4);font-size:13px;">${state.current + 1} / ${questions.length}</span>
              <div class="dim-wrap">
                ${dims.map((d, i) => {
                  const answered = state.answers[d] !== '';
                  const active = q.dim === d;
                  const bg = answered ? 'linear-gradient(135deg,#22c55e,#16a34a)' : active ? 'rgba(34,197,94,0.15)' : 'rgba(255,255,255,0.05)';
                  const color = answered ? '#fff' : active ? '#4ade80' : 'rgba(255,255,255,0.2)';
                  const border = active ? '1px solid #4ade80' : '1px solid transparent';
                  return `<div class="dim-box" style="background:${bg};color:${color};border:${border};">${dimLabels[i]}</div>`;
                }).join('')}
              </div>
            </div>
            <div class="progress"><div style="width:${progress}%;"></div></div>
          </div>

          <div class="${state.animating ? 'fadeout' : 'fadein'} question-box">
            <div class="center" style="margin-bottom:32px;">
              <div class="q-emoji">${q.emoji}</div>
              <p style="color:rgba(255,255,255,0.4);font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:10px;">Q${state.current + 1}</p>
              <h2 style="font-size:19px;font-weight:700;color:#fff;line-height:1.6;">${q.text}</h2>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;">
              ${['a','b'].map((opt) => `
                <button class="btn-ans ${state.chosen === opt ? 'chosen' : ''}" data-opt="${opt}">
                  <span style="min-width:28px;height:28px;background:${opt === 'a' ? 'linear-gradient(135deg,#22c55e,#16a34a)' : 'rgba(255,255,255,0.1)'};border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;">${opt.toUpperCase()}</span>
                  <span style="flex:1;">${q[opt].label}</span>
                </button>
              `).join('')}
            </div>
          </div>
          <p class="hint">나와 가장 가까운 것을 선택하세요</p>
        </div>`;
    }

    function resultView() {
      const data = getResultData();
      return `
        <div class="fadein" style="max-width:640px;width:100%;">
          <div class="result-head" style="background:linear-gradient(135deg, ${data.color[0]} 0%, ${data.color[1]} 50%, ${data.color[2]} 100%);">
            <div class="spinIn" style="font-size:60px;margin-bottom:14px;position:relative;">${data.emoji}</div>
            <div style="display:inline-block;background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);color:#fff;padding:4px 16px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:12px;">${data.badge}</div>
            <h1 style="font-size:28px;font-weight:900;color:#fff;margin-bottom:6px;">${data.title}</h1>
            <p style="color:rgba(255,255,255,0.6);font-size:13px;">${data.desc}</p>
          </div>
          <div class="result-body">
            <div class="grid2">
              <div class="card" style="background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);">
                <p style="color:#4ade80;font-size:11px;font-weight:700;margin-bottom:6px;">💪 핵심 강점</p>
                <p style="color:rgba(255,255,255,0.75);font-size:13px;line-height:1.6;">${data.strength}</p>
              </div>
              <div class="card" style="background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.2);">
                <p style="color:#fbbf24;font-size:11px;font-weight:700;margin-bottom:6px;">⚡ 보완 포인트</p>
                <p style="color:rgba(255,255,255,0.75);font-size:13px;line-height:1.6;">${data.weakpoint}</p>
              </div>
            </div>

            <div style="margin-bottom:28px;">
              <h3 style="color:rgba(255,255,255,0.35);font-size:11px;font-weight:700;letter-spacing:3px;margin-bottom:14px;">나에게 맞는 세일즈 전략</h3>
              <div class="styles">
                ${data.styles.map((s) => `
                  <div class="style-item slide-r">
                    <span class="style-icon" style="background:${hexToRgba(data.accent,0.15)};border:1px solid ${data.accent}40;">${s.icon}</span>
                    <div>
                      <p style="color:#fff;font-weight:700;font-size:14px;margin-bottom:4px;">${s.label}</p>
                      <p class="muted" style="font-size:13px;line-height:1.7;">${s.tip}</p>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div style="background:${hexToRgba(data.accent,0.08)};border:1px solid ${data.accent}30;border-left:3px solid ${data.accent};border-radius:12px;padding:16px 18px;margin-bottom:16px;">
              <p style="color:${data.accent};font-weight:700;font-size:12px;margin-bottom:6px;">🌱 성장 포인트</p>
              <p style="color:rgba(255,255,255,0.65);font-size:13px;line-height:1.7;">${data.growth}</p>
            </div>

            <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:16px 18px;margin-bottom:16px;">
              <p style="color:rgba(255,255,255,0.35);font-weight:700;font-size:11px;letter-spacing:2px;margin-bottom:8px;">💬 나에게 맞는 세일즈 멘트</p>
              <p style="color:rgba(255,255,255,0.8);font-size:14px;line-height:1.7;font-style:italic;">${data.script}</p>
            </div>

            <div style="background:rgba(255,215,0,0.06);border:1px solid rgba(255,215,0,0.2);border-radius:12px;padding:14px 18px;margin-bottom:24px;display:flex;gap:10px;align-items:flex-start;">
              <span style="font-size:18px;">💡</span>
              <p style="color:rgba(255,255,255,0.65);font-size:13px;line-height:1.7;"><strong style="color:#ffd700;">바로 써볼 것</strong> ${data.tip}</p>
            </div>

            <div class="btn-row">
              <button class="btn-secondary share-btn" id="shareBtn">📤 결과 공유하기</button>
              <button class="btn-secondary" id="resetBtn">🔄 다시 테스트하기</button>
            </div>

            <div style="margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.08);">
              <p style="color:rgba(255,255,255,0.38);font-size:11px;line-height:1.7;text-align:center;">
                사내 교육용으로 준비한 자료입니다. 제작: 이예원 · 외부 배포 및 무단 복제를 금합니다.
              </p>
            </div>
          </div>
        </div>`;
    }

    function render() {
      if (state.screen === 'intro') {
        app.innerHTML = introView();
        document.getElementById('startBtn').addEventListener('click', startQuiz);
        return;
      }

      if (state.screen === 'quiz') {
        app.innerHTML = quizView();
        document.querySelectorAll('[data-opt]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const opt = btn.dataset.opt;
            const q = questions[state.current];
            handleAnswer(q[opt].value, opt);
          });
        });
        return;
      }

      if (state.screen === 'result') {
        app.innerHTML = resultView();
        document.getElementById('resetBtn').addEventListener('click', reset);
        document.getElementById('shareBtn').addEventListener('click', handleShare);
      }
    }

    (function boot() {
      const params = new URLSearchParams(window.location.search);
      const shortCode = params.get('r');
      const result = params.get('result');
      if (shortCode && codeResultMap[shortCode]) {
        state.resultMbti = codeResultMap[shortCode];
        state.screen = 'result';
      } else if (result && mbtiData[result]) {
        state.resultMbti = result;
        state.screen = 'result';
      }
      render();
    })();
  </script>
</body>
</html>
